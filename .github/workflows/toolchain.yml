name: toolchain

# Werkzeugkette fuer den 1.21.11-Port: Minecraft 1.21.11 mit Mojang-Namen und
# die Fabric API als Zip in ein PRIVATES Release dieses Repos. Nur zum
# Pruefen beim Entwickeln -- wird nicht an Spieler verteilt.
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths: [ "tools/toolchain/**", ".github/workflows/toolchain.yml" ]

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Klassenpfad fuer 1.21.11 holen
        run: |
          cp -r gradle gradlew tools/toolchain/
          cd tools/toolchain
          chmod +x gradlew
          ./gradlew dumpCp --no-daemon -q
          ls -la build/cp | head -80
          cd build && zip -qr "$RUNNER_TEMP/toolchain-1.21.11.zip" cp
      - name: Als privates Release ablegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view toolchain-1.21.11 >/dev/null 2>&1 || gh release create toolchain-1.21.11 --prerelease --title "Toolchain 1.21.11 (intern)" --notes "Nur zum Pruefen beim Entwickeln. Nicht verteilen."
          gh release upload toolchain-1.21.11 "$RUNNER_TEMP/toolchain-1.21.11.zip" --clobber
