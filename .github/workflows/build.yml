name: build

# Runs on every push and pull request.
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:   # allows starting a run manually from the Actions tab

# contents: write -- noetig, damit die fertige Jar als Release
# veroeffentlicht werden kann (siehe letzter Schritt).
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # JDK 25 -- Minecraft 26.x requires Java 25.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      # Caches Gradle and the downloaded Minecraft files (Client und Addon
      # benutzen dieselbe Minecraft-Version -- wird nur einmal geladen).
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', 'gradle.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      # ---------------------------------------------------------------
      # CLIENT-JAR AUTOMATISCH HOLEN -- nichts mehr von Hand nach libs/.
      #
      # 1. Wahl: den Client aus dem Client-Repo (client_repo in
      #    gradle.properties) frisch bauen -- immer der neueste Stand,
      #    auch wenn dort gerade noch kein Release fertig ist.
      # 2. Wahl: die Jar aus dem neuesten Release des Client-Repos.
      # 3. Wahl: eine eingecheckte libs/vortexclient.jar (alter Weg).
      #
      # client_ref (optional) = Branch oder Tag, z. B. v4.6.3+26.2, falls
      # das Addon gegen einen bestimmten Client-Stand bauen soll.
      # ---------------------------------------------------------------
      - name: Client-Jar holen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          prop() { grep "^$1=" gradle.properties | cut -d= -f2- | tr -d '[:space:]'; }
          REPO=$(prop client_repo)
          REF=$(prop client_ref)
          [ -n "$REPO" ] || REPO="Marcinator31/Vortex-Client"
          mkdir -p libs
          SRC="$RUNNER_TEMP/client-src"
          GEBAUT=""

          echo "=== Client aus $REPO ${REF:-(neuester Stand)} bauen ==="
          if git clone --depth 1 ${REF:+--branch "$REF"} "https://github.com/$REPO.git" "$SRC"; then
            ( cd "$SRC" && chmod +x gradlew && git log -1 --format='Client-Commit: %h %s' )
            for attempt in 1 2 3; do
              if ( cd "$SRC" && ./gradlew build --no-daemon -q ); then GEBAUT=1; break; fi
              [ "$attempt" -lt 3 ] && { echo "Client-Build fehlgeschlagen -- neuer Versuch in 20 s"; sleep 20; }
            done
          fi
          if [ -n "$GEBAUT" ]; then
            JAR=$(ls "$SRC"/build/libs/*.jar | grep -v -- '-sources' | head -n 1)
            cp "$JAR" libs/vortexclient.jar
            echo "Client-Jar frisch gebaut: $(basename "$JAR")"
            exit 0
          fi

          echo "::warning::Client konnte nicht gebaut werden -- nehme die Jar aus dem neuesten Release."
          rm -rf "$RUNNER_TEMP/dl"
          if gh release download ${REF:+"$REF"} --repo "$REPO" --pattern '*.jar' --dir "$RUNNER_TEMP/dl"; then
            JAR=$(ls "$RUNNER_TEMP"/dl/*.jar | grep -v -- '-sources' | head -n 1)
            if [ -n "$JAR" ]; then
              cp "$JAR" libs/vortexclient.jar
              echo "Client-Jar aus Release: $(basename "$JAR")"
              exit 0
            fi
          fi

          if [ -f libs/vortexclient.jar ]; then
            echo "::warning::Nehme die eingecheckte libs/vortexclient.jar (kann veraltet sein)."
            exit 0
          fi
          echo "::error::Keine Client-Jar: weder bauen noch Release-Download ging. client_repo in gradle.properties pruefen."
          exit 1

      # Prueft, ob alles, was das Addon vom Client benutzt, in der Jar ist.
      - name: Check client jar
        run: |
          python3 tools_check_against_jar.py || {
            echo "::error::Das Addon benutzt etwas, das es weder im Client noch im Addon-Quelltext gibt. Fehlt eine Addon-Datei, oder ist die Aenderung im Client noch nicht hochgeladen?"
            exit 1
          }

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      # Up to three attempts.
      #
      # Setup downloads Minecraft, mappings and the loader from external
      # servers (Mojang and FabricMC). If those are briefly unreachable the
      # build fails even though nothing is wrong with the code, and a retry
      # is enough. A real error in the code fails all three attempts alike,
      # and --stacktrace then shows the exact cause.
      - name: Build
        run: |
          set -e
          for attempt in 1 2 3; do
            echo "=== Build attempt $attempt of 3 ==="
            if ./gradlew build --no-daemon --stacktrace 2>&1 | tee build.log; test ${PIPESTATUS[0]} -eq 0; then
              echo "Build succeeded."
              exit 0
            fi
            # Compiler-Fehler als Anmerkungen (sichtbar ohne das ganze Log)
            grep -A3 -E '^/.*\.java:[0-9]+: error: ' build.log | head -60 | sed 's/^/::error::/' || true
            grep -A6 'What went wrong' build.log | head -14 | sed 's/^/::error::/' || true
            if [ "$attempt" -lt 3 ]; then
              echo "Failed -- waiting 20 seconds before retrying."
              sleep 20
            fi
          done
          echo "All three attempts failed."
          exit 1

      # Die fertige Jar als Release veroeffentlichen.
      #
      # WARUM NICHT (NUR) ALS ARTIFACT: Artifacts zaehlen gegen ein
      # Speicherlimit des ganzen GitHub-Kontos. Ist es voll, bricht der
      # Upload mit "Artifact storage quota has been hit" ab -- obwohl der
      # Build geklappt hat. Releases zaehlen nicht dazu.
      #
      # Ein Release je Version (Tag v<mod_version>). Wird dieselbe Version
      # noch einmal gebaut, ersetzt die neue Jar die alte (--clobber).
      # Zu finden auf der Repo-Startseite rechts unter "Releases".
      - name: Publish JAR as release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMITS: ${{ toJSON(github.event.commits) }}
        run: |
          set -e
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          TAG="v${VERSION}"
          # Loom erzeugt mehrere Jars; die ohne "-sources" ist die Mod.
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -n 1)
          echo "Jar: $JAR  ->  Release $TAG"
          # "Was ist neu" fuer die Spieler: die Commit-Nachrichten dieses Pushs
          # (ohne technische Zeilen). Der Launcher zeigt sie nach dem Update an.
          python3 - > "$RUNNER_TEMP/notes.md" <<'PY'
          import json, os, re, subprocess
          try:
              commits = json.loads(os.environ.get("COMMITS") or "null") or []
          except Exception:
              commits = []
          msgs = [c.get("message", "") for c in commits] or [
              subprocess.run(["git", "log", "-1", "--pretty=%B"], capture_output=True, text=True).stdout]
          lines = []
          for m in msgs:
              for l in m.splitlines():
                  l = l.strip()
                  if not l or "claude.ai/code" in l:
                      continue
                  if re.match(r"(?i)^(co-authored-by|claude-session|signed-off-by|add files via upload|merge )", l):
                      continue
                  lines.append(l if l.startswith("-") else "- " + l)
          print("\n".join(dict.fromkeys(lines)) or "- Verbesserungen und Fehlerbehebungen")
          PY
          cat "$RUNNER_TEMP/notes.md"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Vortex Plus Addon $VERSION" \
              --notes-file "$RUNNER_TEMP/notes.md" --target "${GITHUB_SHA}"
          else
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          gh release upload "$TAG" "$JAR" --clobber

      # Zusaetzlich als Artifact, aber nur 3 Tage aufbewahrt und ohne den
      # Build scheitern zu lassen, wenn das Speicherlimit erreicht ist.
      - name: Upload JAR (artifact, optional)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: vortexplus-addon-jar
          path: build/libs/*.jar
          retention-days: 3
