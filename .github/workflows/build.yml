name: build

# Runs on every push and pull request.
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:   # allows starting a run manually from the Actions tab

# contents: write -- noetig, damit die fertige Jar als Release
# veroeffentlicht werden kann (siehe letzter Schritt).
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # JDK 25 -- Minecraft 26.x requires Java 25.
      # build.gradle setzt VERSION_25; mit JDK 21 bricht der Compiler mit
      # "release version 25 not supported" ab.
      # Ohne libs/vortexclient.jar bricht der Build ab -- mit einer
      # lesbaren Meldung aus build.gradle statt hunderter Compilerfehler.
      - name: Check client jar
        run: |
          if [ ! -f libs/vortexclient.jar ]; then
            echo "::error::libs/vortexclient.jar fehlt. Siehe libs/LIESMICH.txt"
            exit 1
          fi
          python3 tools_check_against_jar.py || {
            echo "::error::Die Client-Jar in libs/ passt nicht zum Quelltext -- vermutlich veraltet."
            exit 1
          }


      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      # Caches Gradle and the downloaded Minecraft files.
      #
      # This is not only about speed: once Minecraft is cached, a build no
      # longer fails just because a download source is briefly unreachable.
      # That is exactly what broke an earlier run.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', 'gradle.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      # Up to three attempts.
      #
      # Setup downloads Minecraft, mappings and the loader from external
      # servers (Mojang and FabricMC). If those are briefly unreachable the
      # build fails even though nothing is wrong with the code, and a retry
      # is enough. A real error in the code fails all three attempts alike,
      # and --stacktrace then shows the exact cause.
      - name: Build
        run: |
          set -e
          for attempt in 1 2 3; do
            echo "=== Build attempt $attempt of 3 ==="
            if ./gradlew build --no-daemon --stacktrace; then
              echo "Build succeeded."
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Failed -- waiting 20 seconds before retrying."
              sleep 20
            fi
          done
          echo "All three attempts failed."
          exit 1

      # Die fertige Jar als Release veroeffentlichen.
      #
      # WARUM NICHT (NUR) ALS ARTIFACT: Artifacts zaehlen gegen ein
      # Speicherlimit des ganzen GitHub-Kontos. Ist es voll, bricht der
      # Upload mit "Artifact storage quota has been hit" ab -- obwohl der
      # Build geklappt hat. Releases zaehlen nicht dazu.
      #
      # Ein Release je Version (Tag v<mod_version>). Wird dieselbe Version
      # noch einmal gebaut, ersetzt die neue Jar die alte (--clobber).
      # Zu finden auf der Repo-Startseite rechts unter "Releases".
      - name: Publish JAR as release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          TAG="v${VERSION}"
          # Loom erzeugt mehrere Jars; die ohne "-sources" ist die Mod.
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -n 1)
          echo "Jar: $JAR  ->  Release $TAG"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Vortex Plus Addon $VERSION" \
              --notes "Automatisch gebaut aus ${GITHUB_SHA}." --target "${GITHUB_SHA}"
          fi
          gh release upload "$TAG" "$JAR" --clobber

      # Zusaetzlich als Artifact, aber nur 3 Tage aufbewahrt und ohne den
      # Build scheitern zu lassen, wenn das Speicherlimit erreicht ist.
      - name: Upload JAR (artifact, optional)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: vortexplus-addon-jar
          path: build/libs/*.jar
          retention-days: 3
